# Read the Docs builds the documentation site from mkdocs.yml, with the same uv lock as CI's
# "Documentation site builds" job. Every push to main publishes https://shoal.readthedocs.io/.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --locked --group docs

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true

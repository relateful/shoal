site_name: Shoal
site_description: A fully typed Discord API library for Python, built for bots that grow.
repo_url: https://github.com/relateful/shoal
edit_uri: edit/main/docs/
strict: true
watch:
  - theme

theme:
  name: null
  custom_dir: theme
  static_templates:
    - 404.html

nav:
  - Home: index.md
  - Guide:
      - Architecture: guide/architecture.md
      - Caching and restarts: guide/caching.md
      - Scaling, sharding and IPC: guide/scaling.md
      - Dashboards and REST: guide/dashboards.md
      - Metrics and Grafana: guide/metrics.md
      - Diagnosing a slow bot: guide/diagnostics.md
      - Migrating from discord.py: guide/migrating-from-discord-py.md
  - Roadmap: roadmap.md
  - Discord API coverage: coverage.md
  - API reference: reference/

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_reference.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.magiclink
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

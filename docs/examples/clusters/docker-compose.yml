# Two clusters of one bot, sharing Redis: `docker compose up --build`.
# Each cluster runs half the shards; add clusters by copying one and raising CLUSTER_COUNT everywhere.
x-cluster: &cluster
  build:
    context: ../../..
    dockerfile: docs/examples/clusters/Dockerfile
  env_file: .env # DISCORD_TOKEN, SHARD_COUNT, MAX_CONCURRENCY
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped
  stop_grace_period: 30s

services:
  redis:
    image: redis:7-alpine
    # Redis holds session IDs and carries commands sent as the bot: never expose it.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  cluster-0:
    <<: *cluster
    environment:
      REDIS_URL: redis://redis:6379/0
      CLUSTER_ID: 0
      CLUSTER_COUNT: 2

  cluster-1:
    <<: *cluster
    environment:
      REDIS_URL: redis://redis:6379/0
      CLUSTER_ID: 1
      CLUSTER_COUNT: 2

volumes:
  redis-data:

# The bot, Prometheus scraping it, and Grafana showing it: `docker compose up --build`.
services:
  bot:
    build:
      context: ../../..
      dockerfile: docs/examples/bigbot/Dockerfile
    env_file: .env # DISCORD_TOKEN and the rest; copy .env.example to .env
    environment:
      METRICS_ADDRESS: 0.0.0.0 # reachable by Prometheus on the compose network only; no port is published
      DATA_DIR: /data
    volumes:
      - bot-data:/data # sessions and the cache snapshot survive `docker compose restart bot`
    stop_grace_period: 30s # time to save sessions and the snapshot on shutdown
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - 127.0.0.1:9090:9090

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - 127.0.0.1:3000:3000

volumes:
  bot-data:

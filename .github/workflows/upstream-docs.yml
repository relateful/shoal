name: Mirror Discord docs pull requests

# Discord's docs repository belongs to another organisation, so its webhooks never reach us: poll it.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      since_hours:
        description: Look back this many hours instead of to the last successful run (backfill)
        required: false
        default: ""
      dry_run:
        description: Print what would change without changing anything
        type: boolean
        default: false

# What the fallback GITHUB_TOKEN needs; a GitHub App token, when configured, carries its own.
permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

# One run at a time: two runs could both see no pull request for an upstream change and open two.
concurrency:
  group: upstream-docs-mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror and triage upstream pull requests
    if: github.repository == 'relateful/shoal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      # Pull requests opened with GITHUB_TOKEN do not start CI, so the mirror uses an App token when there is one.
      - name: GitHub App token
        id: app
        if: vars.UPSTREAM_DOCS_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.UPSTREAM_DOCS_APP_CLIENT_ID }}
          private-key: ${{ secrets.UPSTREAM_DOCS_APP_PRIVATE_KEY }}
      - name: Warn that CI will not run on the pull requests
        if: vars.UPSTREAM_DOCS_APP_CLIENT_ID == ''
        run: echo "::warning::No GitHub App configured (see CONTRIBUTING.md); CI will not run on mirror pull requests."
      - name: Mirror
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          SINCE_HOURS: ${{ inputs.since_hours }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--docs-repo ../discord-api-docs)
          if [ -n "$SINCE_HOURS" ]; then
            args+=(--since-hours "$SINCE_HOURS")
          else
            args+=(--workflow upstream-docs.yml)
          fi
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          uv run python scripts/mirror_upstream_prs.py "${args[@]}"

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format, lint and conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - name: Formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Constant blocks are sorted
        run: uv run python scripts/sort_constants.py --check
      - name: Payload exports are generated
        run: uv run python scripts/generate_exports.py --check
      - name: Layer contracts
        run: uv run lint-imports

  types:
    name: Type checking (pyright and mypy, strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - name: pyright
        run: uv run pyright
      - name: mypy
        run: uv run mypy

  test:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: pytest with coverage
        run: uv run pytest --cov --cov-report=term-missing:skip-covered --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: matrix.python == '3.12' && matrix.os == 'ubuntu-latest'
        with:
          name: coverage
          path: coverage.xml

  discord-docs:
    name: Links, routes and coverage match the pinned Discord docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - name: Fetch the Discord docs revision discord-api-docs.lock pins
        run: |
          git init --quiet ../discord-api-docs
          git -C ../discord-api-docs fetch --quiet --depth 1 https://github.com/discord/discord-api-docs "$(cat discord-api-docs.lock)"
          git -C ../discord-api-docs checkout --quiet --detach FETCH_HEAD
      - name: Check every docs link and route, and docs/coverage.md
        run: uv run python scripts/check_docs.py --docs-repo ../discord-api-docs --check-coverage docs/coverage.md
      # A mirror pull request pins an upstream change before Discord merges it; this keeps it from merging
      # early. It runs even when the steps above fail, so an unfetchable pin still says why.
      - name: The pinned revision is on Discord's main branch
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pin=$(cat discord-api-docs.lock)
          if ! [[ "$pin" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::discord-api-docs.lock must hold one full commit hash"
            exit 1
          fi
          status=$(gh api "repos/discord/discord-api-docs/compare/main...$pin" --jq .status)
          if [ "$status" != behind ] && [ "$status" != identical ]; then
            echo "::error::discord-api-docs.lock pins a revision that is not on Discord's main branch ($status)"
            exit 1
          fi

  docs-site:
    name: Documentation site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked --group docs
      - name: mkdocs build --strict
        run: uv run mkdocs build --strict

name: Release

# Pushing a tag `vX.Y.Z` that matches `src/shoal/_version.py` builds Shoal, publishes it to PyPI and
# creates a GitHub release from the tag's CHANGELOG.md section. PyPI trusts this workflow through
# trusted publishing: no token is stored. The `pypi` environment can require an approval first.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and check the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - name: The tag matches the package version
        run: |
          version=$(uv run python -c "from shoal import __version__; print(__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match src/shoal/_version.py ($version)"
            exit 1
          fi
      - name: The tag is on main
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: CHANGELOG.md has a section for this version
        run: uv run python scripts/release_notes.py "${GITHUB_REF_NAME#v}" > release-notes.md
      - name: Tests
        run: uv run pytest -q
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/shoal/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3

  github-release:
    name: Create the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts/
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *a*|*b*|*rc*|*dev*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" artifacts/dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes-file artifacts/release-notes/release-notes.md $prerelease

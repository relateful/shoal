name: Discord API coverage

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: docs/coverage.md matches the current Discord docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - name: Fetch the Discord docs source
        run: git clone --depth 1 https://github.com/discord/discord-api-docs ../discord-api-docs
      - name: Regenerate the report
        run: uv run python scripts/check_docs.py --docs-repo ../discord-api-docs --coverage coverage.md
      - name: Fail when Discord documented something new
        run: |
          if ! diff -u docs/coverage.md coverage.md; then
            echo "Discord's docs changed: copy coverage.md over docs/coverage.md and review the new endpoints."
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: coverage
          path: coverage.md
